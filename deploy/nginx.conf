# /etc/nginx/sites-available/serviam  → symlink into sites-enabled, then certbot --nginx
server {
  listen 80;
  server_name serviam.minorharmony.com;

  # certbot will add the 443 block + redirect automatically.

  # Serve the built PWA directly (fast), proxy the API to Node.
  root /var/www/serviam/web/dist;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;   # SPA fallback
  }
}
