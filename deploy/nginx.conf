# /etc/nginx/sites-available/minorharmony.com.conf → symlink into sites-enabled,
# then certbot --nginx.
server {
  listen 80;

  # We serve the apex + www today, because those already resolve to this box.
  # `serviam.` is listed too so that the day its A record appears it just works —
  # nginx is happy to hold a name that doesn't resolve yet. Do NOT pass -d for it
  # to certbot until it resolves, or the HTTP-01 challenge fails and takes the
  # whole issuance down with it. See deploy/DEPLOY.md §1.
  server_name minorharmony.com www.minorharmony.com serviam.minorharmony.com;

  # certbot will add the 443 block + redirect automatically.

  # Serve the built PWA directly (fast), proxy the API to Node.
  root /var/www/serviam/web/dist;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;   # SPA fallback
  }
}
