# /etc/nginx/sites-available/minorharmony.com.conf → symlink into sites-enabled.
#
# The TLS block below is written by hand, NOT by `certbot --nginx`. Two reasons:
#   1. certbot's nginx *installer* fails on this box — it parses every vhost's TLS
#      config and one of the other ~20 sites references a 1024-bit RSA key, which
#      modern certbot refuses to load ("Unsupported RSA key length: 1024"). That
#      has nothing to do with our cert, but it blocks the installer regardless.
#   2. This file is a symlink into the repo, so anything certbot wrote here would
#      be destroyed by the next deploy's `git reset --hard`.
# So: certbot only *issues* (webroot), nginx config lives in git. See DEPLOY.md §3.

server {
  listen 80;

  # We serve the apex + www today, because those already resolve to this box.
  # `serviam.` is listed too so that the day its A record appears it at least
  # answers on :80 — nginx is happy to hold a name that doesn't resolve yet.
  # It is deliberately NOT in the 443 block: the cert doesn't cover it, so a
  # redirect there would land the browser on a name mismatch. See DEPLOY.md §1.
  server_name minorharmony.com www.minorharmony.com serviam.minorharmony.com;

  # ACME HTTP-01 lives outside the SPA root so `try_files` can't swallow it with
  # the index.html fallback. `^~` stops nginx testing the regex locations too.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;                 # old-style http2 flag: works on 1.18 (this box) and later
  server_name minorharmony.com www.minorharmony.com;

  ssl_certificate     /etc/letsencrypt/live/minorharmony.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/minorharmony.com/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_session_cache shared:SSL_serviam:10m;   # name must be unique across this shared box

  # HSTS is intentionally off until the domain has settled. Turning it on pins
  # every visitor to HTTPS for max-age, which is painful to undo if we later move
  # Serviam to serviam.minorharmony.com and leave the apex without a cert.
  # add_header Strict-Transport-Security "max-age=15768000" always;

  # Serve the built PWA directly (fast), proxy the API to Node.
  root /var/www/serviam/web/dist;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;   # SPA fallback
  }
}
