# /etc/nginx/sites-available/minorharmony.com.conf → symlink into sites-enabled.
#
# The TLS blocks below are written by hand, NOT by `certbot --nginx`. Two reasons:
#   1. certbot's nginx *installer* fails on this box — it parses every vhost's TLS
#      config and one of the other ~20 sites references a 1024-bit RSA key, which
#      modern certbot refuses to load ("Unsupported RSA key length: 1024"). That
#      has nothing to do with our cert, but it blocks the installer regardless.
#   2. This file is a symlink into the repo, so anything certbot wrote here would
#      be destroyed by the next deploy's `git reset --hard`.
# So: certbot only *issues* (webroot), nginx config lives in git. See DEPLOY.md §3.
#
# serviam.minorharmony.com is the app's home. The apex and www just redirect to it,
# so there is exactly one origin — one session cookie, one PWA install, one service
# worker scope. One cert (--cert-name minorharmony.com) covers all three names.
# Shared TLS settings live in nginx-tls.conf, included by both 443 blocks.

server {
  listen 80;
  server_name minorharmony.com www.minorharmony.com serviam.minorharmony.com;

  # ACME HTTP-01 lives outside the SPA root so `try_files` can't swallow it with
  # the index.html fallback. `^~` stops nginx testing the regex locations too.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://serviam.minorharmony.com$request_uri;
  }
}

# Apex + www → the app's real name.
server {
  listen 443 ssl http2;                 # old-style http2 flag: works on 1.18 (this box) and later
  server_name minorharmony.com www.minorharmony.com;

  ssl_certificate     /etc/letsencrypt/live/minorharmony.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/minorharmony.com/privkey.pem;
  include /var/www/serviam/deploy/nginx-tls.conf;

  location / {
    return 301 https://serviam.minorharmony.com$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name serviam.minorharmony.com;

  ssl_certificate     /etc/letsencrypt/live/minorharmony.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/minorharmony.com/privkey.pem;
  include /var/www/serviam/deploy/nginx-tls.conf;

  # HSTS for this host only — deliberately NOT includeSubDomains, because other
  # names under minorharmony.com may not have certs. Started at one week; raise
  # to 31536000 once it has run clean for a while.
  add_header Strict-Transport-Security "max-age=604800" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  # Serve the built PWA directly (fast), proxy the API to Node.
  root /var/www/serviam/web/dist;
  index index.html;

  location /api/ {
    # EPUB uploads. nginx's default is 1m, which silently 413s any book over
    # ~1 MB before Node sees it — multer is set to 50 MB, so without this the
    # two limits disagree and the app-level error message never fires.
    client_max_body_size 60m;
    proxy_read_timeout 120s;            # a big EPUB over a slow uplink

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;   # SPA fallback
  }
}
