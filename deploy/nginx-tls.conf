# Included by both 443 blocks in nginx.conf. Not a vhost — never symlink this into
# sites-enabled.
#
# Mozilla "intermediate" profile: TLS 1.2+ with forward-secret AEAD ciphers only.
# The cert is ECDSA, so the ECDHE-ECDSA suites are the ones actually negotiated.
# No OCSP stapling: Let's Encrypt shut its OCSP responders down in 2025.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL_serviam:10m;   # name must be unique across this shared box
ssl_session_tickets off;
