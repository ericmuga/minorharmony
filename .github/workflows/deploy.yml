name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust VPS host key
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Pull, build, reload
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
            set -euo pipefail
            cd /var/www/serviam

            # Shared box: we require Node >= 20 but never pin an exact major,
            # because other apps on this VPS run on the same system Node.
            NODE_MAJOR=$(node -v 2>/dev/null | sed 's/v\([0-9]*\).*/\1/')
            if [[ -z "${NODE_MAJOR:-}" || "$NODE_MAJOR" -lt 20 ]]; then
              echo "FATAL: VPS has $(node -v 2>/dev/null || echo no-node), needs Node >= 20." >&2
              echo "       Run: cd /var/www/serviam && bash deploy/bootstrap.sh" >&2
              exit 1
            fi

            git fetch --prune origin
            git reset --hard origin/main

            # /usr/etc/npmrc on this box points the npm cache at /var/cache/npm,
            # which belongs to a different user ("deploy") — unwritable for us.
            # Keep our cache in our own home instead of touching that shared file.
            export npm_config_cache="$HOME/.npm"

            # node_modules must belong to us. If someone ran npm as root by hand,
            # `npm ci` cannot remove the old tree and dies with EACCES on rmdir.
            for d in server/node_modules web/node_modules; do
              if [[ -e "$d" && ! -O "$d" ]]; then
                echo "FATAL: $d is owned by $(stat -c %U "$d"), not $(whoami)." >&2
                echo "       On the box: sudo chown -R $(whoami): /var/www/serviam" >&2
                exit 1
              fi
            done

            (cd server && npm ci --omit=dev)
            (cd web && npm ci && npm run build)

            # systemd units + nginx vhost are symlinks into the repo (set up by bootstrap.sh)
            # so a git pull already updated their content — we just reload.
            sudo /bin/systemctl daemon-reload
            sudo /usr/sbin/nginx -t
            sudo /bin/systemctl reload nginx
            sudo /bin/systemctl restart serviam

            # Don't call a deploy green until the API actually answers.
            for i in $(seq 1 15); do
              if curl -fsS -m 3 http://127.0.0.1:8787/api/health >/dev/null; then
                echo "Deploy OK: $(git rev-parse --short HEAD)"
                exit 0
              fi
              sleep 1
            done
            echo "FATAL: serviam did not become healthy on :8787" >&2
            systemctl status serviam --no-pager | tail -20 >&2 || true
            exit 1
          REMOTE
